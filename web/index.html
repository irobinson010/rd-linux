<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wayland Remote Desktop</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="bar">
    <span id="status">connecting…</span>
    <span class="spacer"></span>
    <button id="menubtn" title="Menu" aria-label="Menu">☰</button>
    <div id="controls">
    <span id="monitors"></span>
    <select id="res" title="Streaming resolution">
      <option value="1280x720">720p</option>
      <option value="1920x1080">1080p</option>
      <option value="2560x1440" selected>1440p</option>
      <option value="3840x2160">2160p (4K)</option>
    </select>
    <select id="bitrate" title="Bitrate">
      <option value="8000">8 Mbps</option>
      <option value="20000" selected>20 Mbps</option>
      <option value="40000">40 Mbps</option>
      <option value="80000">80 Mbps</option>
    </select>
    <button id="control" disabled>Take control</button>
    <button id="clipbtn" title="Shared clipboard" hidden>📋 Clipboard</button>
    <button id="sharebtn" title="Create a view-only link to share">Share view</button>
    <button id="fill">Fill</button>
    <button id="sound">🔇 Sound off</button>
    <button id="zoomout" title="Zoom out">−</button>
    <button id="zoomin" title="Zoom in">+</button>
    <button id="zoomreset" title="Reset zoom">1:1</button>
    <button id="keyboard" title="On-screen keyboard (type from a phone)">⌨</button>
    <button id="fullscreen">Fullscreen</button>
    </div>
  </div>
  <div id="stage">
    <video id="screen" autoplay playsinline muted></video>
    <!-- Hidden field: focusing it pops the phone's soft keyboard so we can capture
         typing and forward it. Must stay focusable (not display:none). -->
    <textarea id="kbdinput" autocomplete="off" autocorrect="off"
              autocapitalize="none" spellcheck="false" aria-hidden="true"
              tabindex="-1" rows="1"></textarea>
    <div id="overlay" class="hidden">
      <p id="overlay-text"></p>
      <button id="overlay-btn" hidden></button>
    </div>
    <div id="sharebox" class="hidden">
      <p id="sharemsg">View-only link — recipients can watch but not control:</p>
      <input id="sharelink" type="text" readonly>
      <div class="sharebtns">
        <button id="sharecopy">Copy</button>
        <button id="sharerevoke"
                title="Invalidate every minted view link and disconnect its viewers">
          Revoke all links</button>
        <button id="shareclose">Close</button>
      </div>
    </div>
    <!-- Shared clipboard panel. Text here stays in sync with the remote PC's
         clipboard; also a universal fallback where the browser blocks silent
         clipboard access (Firefox/Safari) -- paste in and hit "Send to remote". -->
    <div id="clipbox" class="hidden">
      <p>Shared clipboard — stays in sync with the remote PC.</p>
      <textarea id="cliptext" rows="4" spellcheck="false"
                placeholder="Paste here, then Send to remote…"></textarea>
      <div class="sharebtns">
        <button id="clipsend">Send to remote</button>
        <button id="clipclose">Close</button>
      </div>
    </div>
    <!-- Token entry: shown when no token is stored (first visit without a
         ?token= link) or when the stored one is rejected. Typing it here keeps
         the secret out of the address bar / browser history entirely. -->
    <div id="tokenbox" class="hidden">
      <p id="tokenmsg">Enter the access token for this machine:</p>
      <input id="tokeninput" type="password" autocomplete="off"
             placeholder="access token">
      <div class="sharebtns">
        <button id="tokengo">Connect</button>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
